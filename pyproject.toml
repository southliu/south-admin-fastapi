[project]
name = "south-admin-fastapi"
version = "0.1.0"
description = "South Admin FastAPI 后台管理系统"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.137.1",
    "uvicorn>=0.49.0",
    "sqlalchemy>=2.0.25",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "pydantic>=2.5.3",
    "pyyaml>=6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.2",
    "greenlet>=3.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py314"
line-length = 79
indent-width = 4
include = ["*.py", "*.pyi"]
extend-exclude = [".zcode"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "E501",
    "F",
    "I",
    "N",
    "B",
    "UP",
    "SIM",
    "PIE",
    "RUF",
    "W291",
    "W292",
    "W293",
    "W505",
]
ignore = [
    "B008", # FastAPI intentionally uses Depends/Query calls as defaults.
    "RUF001", # Chinese business messages intentionally use full-width punctuation.
    "RUF002", # Chinese docstrings intentionally use full-width punctuation.
    "RUF003", # Chinese comments intentionally use full-width punctuation.
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 72
